[package]
name = "epub3-kindle"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust library and CLI for converting KindleGen-compatible EPUB 3 publications to Kindle KF8-only AZW3 or canonical Dual MOBI"
license = "MIT"
repository = "https://github.com/cbz-tools/Epub3-Kindle"
readme = "README.md"
keywords = ["epub", "kindle", "azw3", "mobi", "ebook"]
categories = ["command-line-utilities", "encoding", "multimedia::encoding"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "./README.md",
    "README.ja.md",
    "CHANGELOG.md",
    "LICENSE",
    "THIRDPARTY_LICENSES.md",
    "scripts/verify-package.ps1",
    "src/**",
]

[lib]
name = "epub3_kindle"
path = "src/lib.rs"

[[bin]]
name = "epub3-kindle"
path = "src/bin/epub3-kindle.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = []

[dependencies]
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.37"
thiserror = "2"
unicode-normalization = "0.1"
zip = "2.2"

[build-dependencies]
winresource = "0.1"
